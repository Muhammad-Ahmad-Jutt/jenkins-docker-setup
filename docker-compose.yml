version: "3.9"

services:
  jenkins:
    build: .
    container_name: jenkins-server
    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # For Jenkins agent communication
    volumes:
      - ./data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  data:
