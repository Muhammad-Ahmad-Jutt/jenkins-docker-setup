version: "3.9"

services:
  jenkins:
    build: .
    container_name: jenkins-server
    user: root                   # ensures Jenkins can access Docker socket
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
