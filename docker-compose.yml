services:
  jenkins:
    build: .
    container_name: jenkins-server
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home       
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/local/bin/docker-compose:/usr/local/bin/docker-compose
    environment:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/usr/share/jenkins/ref/casc_configs/jenkins-configration.yaml"
      JENKINS_ADMIN_ID: "ahmad"
      JENKINS_ADMIN_PASSWORD: "ahmad"
      JENKINS_jobcreator_ID: "ahmadjob"
      JENKINS_jobcreator_PASSWORD: "ahmadjob"
      JOB_NAME: "portfolio-backend-build"
      GIT_REPO: "https://github.com/Muhammad-Ahmad-Jutt/portfolio-backend.git"
      GIT_BRANCH: "main"
      JOB_FILENAME: "config.xml"
volumes:
  jenkins_home:
