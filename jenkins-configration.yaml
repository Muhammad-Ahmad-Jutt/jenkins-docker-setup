jenkins:
  remotingSecurity:
    enabled: true

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: ${JENKINS_jobcreator_ID}
          password: ${JENKINS_jobcreator_PASSWORD}

  authorizationStrategy:
    globalMatrix:
      permissions:
        # Admin permissions
        - "Overall/Administer:${JENKINS_ADMIN_ID}"
        - "Overall/Read:authenticated"

        # Job creator permissions
        - "Job/Create:authenticated"
        - "Job/Configure:authenticated"
        - "Job/Read:authenticated"
        - "Job/Build:authenticated"
        - "Job/Discover:authenticated"

unclassified:
  location:
    url: http://127.0.0.1:8080/

# Example seed job (uncomment if you want Jenkins to auto-load your Groovy job DSL)
# jobs:
#   - file: /usr/local/seed.groovy
jobs:
  - script: |
      job("portfolio-backend-build") {
          description("This workflow will handle the CI/CD for the portfolio backend project")
          keepDependencies(false)
          disabled(false)
          concurrentBuild(false)

          scm {
              git {
                  remote {
                      github("Muhammad-Ahmad-Jutt/portfolio-backend", "https")
                  }
                  branch("*/main")
              }
          }

          triggers {
              scm("H/15 * * * *") // replicate your TimerTrigger
          }

          steps {
              shell("""
                  docker compose down
                  docker compose up --build -d
              """)
          }

          wrappers {
              preBuildCleanup {
                  deleteDirectories(false)
                  cleanupParameter()
              }
          }

          configure { project ->
              // Add GitHub Project Property
              project / 'properties' / 'com.coravy.hudson.plugins.github.GithubProjectProperty' {
                  'projectUrl'('https://github.com/Muhammad-Ahmad-Jutt/portfolio-backend/')
                  displayName()
              }
          }
      }
